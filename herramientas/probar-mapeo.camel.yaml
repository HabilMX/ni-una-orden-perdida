# Herramienta: corre un mapeo JSONata contra sus casos dorados y dice cuáles pasan.
# Cada caso es una carpeta con entrada.json (lo que llega) y esperado.json (lo que debe salir).
# No la edites: la usa el script probar-mapeo.
- route:
    id: probar-mapeo
    from:
      uri: "file:{{casos}}"
      parameters:
        recursive: true
        noop: true
        include: "entrada\\.json"
      steps:
        - setVariable:
            name: caso
            expression:
              simple:
                expression: "${header.CamelFileParent}"
        # Lo que entra al mapeo es el texto JSON del caso
        - to:
            uri: "jsonata:file:{{mapeo}}"
            parameters:
              inputType: JsonString
              outputType: JsonString
        - setVariable:
            name: obtenido
            expression:
              simple:
                expression: "${bodyAs(String)}"
        # Normalizar los números para comparar por valor (210 = 210.0)
        - to:
            uri: "jsonata:file:herramientas/normalizar.jsonata"
            parameters:
              inputType: JsonString
              outputType: JsonString
        - setVariable:
            name: obtenidoNormal
            expression:
              simple:
                expression: "${bodyAs(String)}"
        # Traer el esperado del mismo caso y convertir ambos a datos para compararlos sin importar espacios ni orden de llaves
        - pollEnrich:
            expression:
              simple:
                expression: "file:${variable.caso}?fileName=esperado.json&noop=true&idempotent=false"
            timeout: 3000
        # El esperado en una sola línea, para mostrarlo completo si el caso falla
        - to:
            uri: "jsonata:file:herramientas/compactar.jsonata"
            parameters:
              inputType: JsonString
              outputType: JsonString
        - setVariable:
            name: esperadoTexto
            expression:
              simple:
                expression: "${bodyAs(String)}"
        - to:
            uri: "jsonata:file:herramientas/normalizar.jsonata"
            parameters:
              inputType: JsonString
              outputType: JsonString
        - unmarshal:
            json: {}
        - setVariable:
            name: esperado
            expression:
              simple:
                expression: "${body}"
        - setBody:
            expression:
              simple:
                expression: "${variable.obtenidoNormal}"
        - unmarshal:
            json: {}
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${body} == ${variable.esperado}"
                steps:
                  - log:
                      message: "CASO-OK ${variable.caso}"
            otherwise:
              steps:
                - log:
                    message: "CASO-FALLA ${variable.caso}\n   esperaba: ${variable.esperadoTexto}\n   obtuve:   ${variable.obtenido}"
