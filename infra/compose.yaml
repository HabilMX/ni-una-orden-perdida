# El ambiente de la práctica: los destinos emulados y la base de estado.
# Se levanta con:   docker compose -f infra/compose.yaml up -d --wait
#
# ⚠️ Las contraseñas de aquí son de PRÁCTICA, para una máquina local. No son secretos:
#    por eso viven en el archivo. En un sistema real llegan por variables o por un gestor de secretos.
name: practica-retail

services:
  # Base de estado del router (lección 15 en adelante). Solo el router escribe aquí.
  estado:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: estado
      POSTGRES_USER: router
      POSTGRES_PASSWORD: ${ESTADO_CLAVE:-practica}
    ports: ["15432:5432"]   # en tu máquina, 15432: así no choca con un PostgreSQL que ya tengas
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U router -d estado"]
      interval: 3s
      retries: 20

  # El ERP emulado: tablas de cabecera y detalle, y el procedimiento que registra el pedido.
  erp:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: erp
      MARIADB_USER: integracion
      MARIADB_PASSWORD: ${ERP_CLAVE:-practica}
      MARIADB_ROOT_PASSWORD: ${ERP_CLAVE_ROOT:-practica-root}
    ports: ["13306:3306"]   # en tu máquina, 13306: así no choca con un MySQL o MariaDB que ya tengas
    volumes:
      - ./mariadb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 30

  # La API demo de pedidos: el destino REST (lección 02 en adelante). Exige Idempotency-Key.
  # Desde la 1.3.0 recibe los eventos del pedido (embarcado, entregado) y su GET dice el estatus y la guía.
  # Desde la 1.4.0, POST /admin/modo la vuelve lenta o la hace rechazar (lecciones 19 y 20).
  # Desde la 1.5.0, también saturada: contesta 429 con Retry-After unas veces y luego atiende (lección 20).
  api-pedidos:
    build: ./api-demo
    image: practica-retail/api-demo:1.5.0
    ports: ["8081:8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /q/health/ready HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 3s
      retries: 40

  # El SFTP del socio comercial: aquí se depositan los EDI X12 (lección 07 en adelante).
  socio-sftp:
    image: atmoz/sftp:alpine
    command: "socio:${SFTP_CLAVE:-practica}:1001::entrada,salida"
    ports: ["2222:22"]
    # Desde la lección 21, la carpeta del socio la comparte socio-bot, que deja ahí sus acuses
    volumes:
      - socio-home:/home/socio
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22"]
      interval: 3s
      retries: 20

  # El sistema del socio (lección 21): lee lo que le dejamos en entrada/ y, al cabo de unos segundos, deja en
  # salida/ su acuse funcional, un 997. Rechaza un documento que pida un producto que no conoce (RECHAZA_SKU).
  socio-bot:
    image: alpine:3.22
    command: ["sh", "/bot/bot.sh"]
    environment:
      ACUSE_SEGUNDOS: "8"
      RECHAZA_SKU: SKU-9999
    volumes:
      - ./socio-bot:/bot:ro
      - socio-home:/home/socio
    depends_on:
      socio-sftp:
        condition: service_healthy

  # Kafka (lecciones 28 a 30): el tópico donde el router deja cada momento de la orden y de donde lo leen los canales.
  # Solo arranca con el perfil «kafka»; las lecciones 00 a 27 no lo usan, y sin el perfil no se levanta:
  #   docker compose -f infra/compose.yaml --profile kafka up -d --wait
  # Es la imagen oficial del proyecto Apache Kafka (licencia Apache 2.0), en modo KRaft: un solo nodo que hace de
  # broker y de controlador, sin ZooKeeper. Los servicios de las lecciones lo alcanzan por su nombre: kafka:9092.
  # No guarda en un volumen: al recrearlo (como hacen los verifica) empieza vacío, sin tópicos ni grupos.
  kafka:
    image: apache/kafka:4.4.0
    profiles: [kafka]
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw   # un identificador fijo (UUID en base64): el de la documentación de la imagen
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Un solo nodo: los tópicos internos (offsets de los grupos, transacciones) van con una sola copia
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # Un grupo que se forma no espera 3 s a ver si llega alguien más: en la práctica arrancan y paran seguido
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Los tópicos se crean solos al primer uso, con 3 particiones: una por cada copia de int-bd
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      # Medio giga de memoria alcanza para la práctica (por omisión pide uno entero)
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 30s
      retries: 30

volumes:
  socio-home:
