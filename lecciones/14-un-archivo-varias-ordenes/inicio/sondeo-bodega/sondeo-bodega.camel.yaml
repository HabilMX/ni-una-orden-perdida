# El sondeo de la bodega, lección 14: la bodega ya no deja un archivo por embarque, sino un LOTE con varios.
# Partirlo (Splitter) es tu trabajo de hoy. Ya partido, le pasa cada embarque al router por separado:
#
#   bodega → buzon/lote-bodega-<n>.json → [sondeo] → split → POST /embarques (uno por embarque) → router
#
# Si un embarque del lote no pasa, los demás siguen (stopOnException: false). Al terminar, el lote se aparta a
# .error/ para que alguien vea cuál falló; lo que sí pasó ya está en sus destinos.
# Corre en UNA sola copia, igual que en la 13.

# Cuando el router no acepta un embarque, se anota cuál fue y qué contestó, y el Splitter sigue con el siguiente
- onException:
    exception:
      - org.apache.camel.http.base.HttpOperationFailedException
    steps:
      - log:
          loggingLevel: WARN
          message: "El router no aceptó el embarque de la orden ${variable.orden} del ${variable.lote} (contestó ${exception.statusCode}): sigo con los demás"

- route:
    id: sondeo-bodega
    from:
      uri: file:buzon
      parameters:
        include: "lote-bodega-.*\\.json"
        readLock: changed
        move: ".camel/${file:name}"
        moveFailed: ".error/${file:name}"
        delay: 2000
      steps:
        - convertBodyTo:
            type: String
        - setVariable:
            name: lote
            expression:
              simple:
                expression: "${file:name}"
        - log:
            message: "Tomé ${variable.lote} del buzón de la bodega; trae ${jsonpath($.embarques.length())} embarques"
        # TODO 1: hoy el lote completo se le manda al router como si fuera UN embarque, y el router no lo entiende.
        #         Pártelo con un split: un mensaje por cada elemento de la lista «embarques».
        #         La expresión es JSONPath:  $.embarques[*]
        # TODO 2: deja escrito que un embarque malo no detiene a los demás (opción stopOnException del split).
        #         Antes de correrlo: ¿qué valor trae por omisión? Predice qué pasa con los otros cuatro del lote 0002.
        # TODO 3: dentro del split van, para cada parte, los pasos de abajo: guardar la orden y mandarla al router.
        #         Muévelos adentro. Cada parte llega como datos (un mapa), no como texto: antes de mandarla,
        #         vuélvela texto JSON con un marshal (json). Y la orden de la parte ya se lee como ${body[orden]}.
        - setVariable:
            name: orden
            expression:
              jsonpath:
                expression: "$.orden"
                suppressExceptions: true
        - removeHeaders:
            pattern: "*"
        - setHeader:
            name: Content-Type
            expression:
              constant:
                expression: application/json
        - to:
            uri: http://orden-router:8080/embarques
            parameters:
              httpMethod: POST
        - log:
            message: "Embarque de la orden ${variable.orden} del ${variable.lote}: el router lo recibió (contestó ${header.CamelHttpResponseCode})"
        - log:
            message: "Terminé el ${variable.lote}"
