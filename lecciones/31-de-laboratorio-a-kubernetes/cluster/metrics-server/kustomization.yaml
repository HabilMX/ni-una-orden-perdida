# metrics-server: el que mide cuánta CPU usa cada Pod. Sin él, el HPA no tiene con qué decidir y dice <unknown>.
# Va la versión fija v0.9.1, tal como la publica su proyecto, con UN ajuste para kind (abajo).
#
#   kubectl apply -k cluster/metrics-server
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.1/components.yaml
patches:
  # En kind, el certificado del kubelet (el agente del nodo) no está firmado por una autoridad que metrics-server
  # conozca. --kubelet-insecure-tls le dice que confíe igual. Es aceptable en un clúster de práctica dentro de tu
  # máquina; en un clúster de verdad, los certificados se firman bien y este ajuste NO se usa.
  - target:
      kind: Deployment
      name: metrics-server
      namespace: kube-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
