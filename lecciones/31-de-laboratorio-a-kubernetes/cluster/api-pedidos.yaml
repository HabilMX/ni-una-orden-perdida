# El destino de int-rest, DENTRO del clúster: la misma API de pedidos de la lección 00 (infra/api-demo), con el
# mismo nombre, api-pedidos. Por eso la ruta de int-rest no cambia ni una letra: sigue llamando a
# http://api-pedidos:8080/pedidos, y aquí ese nombre lo resuelve un Service de Kubernetes en vez del DNS de Docker.
# Este archivo NO se toca en la lección.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-pedidos
  labels: { app: api-pedidos }
spec:
  replicas: 1                       # la API guarda los pedidos en su memoria: una sola copia, como en Compose
  selector:
    matchLabels: { app: api-pedidos }
  template:
    metadata:
      labels: { app: api-pedidos }
    spec:
      containers:
        - name: api-pedidos
          image: ni-una-orden-perdida/api-demo:1.4.0
          imagePullPolicy: Never    # la imagen la subió «kind load» al nodo; no hay registro de dónde bajarla
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 250m, memory: 192Mi }
            limits: { cpu: "1", memory: 384Mi }
          readinessProbe:
            httpGet: { path: /q/health/ready, port: 8080 }
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-pedidos
spec:
  selector: { app: api-pedidos }
  ports:
    - port: 8080
      targetPort: 8080
