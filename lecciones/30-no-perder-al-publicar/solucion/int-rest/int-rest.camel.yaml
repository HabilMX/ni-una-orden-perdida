# int-rest: el servicio que sabe hablar con la API de pedidos.
# Recibe la orden del router, la traduce al formato de la API y la entrega.
# El hilo: lee ce-correlationid del sobre y se lo pasa a la API como X-Correlation-Id.

# El cliente HTTP de Camel, por su cuenta, repite en silencio una llamada que recibe un 429 o un 503, y espera lo que
# diga su Retry-After. Aquí se apaga: int-rest le cuenta al router lo que contestó la API y ya; el que reintenta es el
# router (si los dos repitieran, los reintentos se multiplicarían).
- beans:
    - name: http
      type: org.apache.camel.component.http.HttpComponent
      properties:
        automaticRetriesDisabled: true

- route:
    id: int-rest
    from:
      uri: platform-http:/integrar
      parameters:
        httpMethodRestrict: POST
      steps:
        # Del sobre se guarda lo que hace falta ANTES de limpiar encabezados
        - setVariable:
            name: llave
            expression:
              simple:
                expression: "${header.ce-subject}"
        - setVariable:
            name: correlacion
            expression:
              simple:
                expression: "${header.ce-correlationid}"
        - log:
            message: "Recibí del router la orden ${variable.llave} correlacion=${variable.correlacion} (sobre ${header.ce-id}, tipo ${header.ce-type})"
        - to:
            uri: jsonata:mappings/api/pedido/v2/mapeo.jsonata
            parameters:
              inputType: JsonString
              outputType: JsonString
        - removeHeaders:
            pattern: "*"
        - setHeader:
            name: Idempotency-Key
            expression:
              simple:
                expression: "${variable.llave}"
        - setHeader:
            name: X-Correlation-Id
            expression:
              simple:
                expression: "${variable.correlacion}"
        - setHeader:
            name: Content-Type
            expression:
              constant:
                expression: application/json
        # La API tiene 3 segundos para contestar (lección 20). Si no contesta a tiempo, int-rest no sabe si el pedido
        # quedó o no: lo dice con un 504 y lo que pasó, sin inventar un «sí» ni un «no».
        - doTry:
            steps:
              - to:
                  uri: http://api-pedidos:8080/pedidos
                  parameters:
                    httpMethod: POST
                    throwExceptionOnFailure: false
                    responseTimeout: 3000
            doCatch:
              - exception:
                  - java.io.IOException
                steps:
                  - log:
                      loggingLevel: WARN
                      message: "La API no contestó a tiempo la orden ${variable.llave} correlacion=${variable.correlacion}: no sé si la registró (${exception.class.simpleName})"
                  - setHeader:
                      name: CamelHttpResponseCode
                      expression:
                        constant:
                          expression: 504
                  - setBody:
                      expression:
                        simple:
                          expression: '{"resultado":"no se sabe","motivo":"${exception.class.simpleName}: la API no contestó en 3 s"}'
        # Qué versión del mapeo se usó: el router la anota en el intento (lección 15)
        - setHeader:
            name: X-Version-Mapeo
            expression:
              constant:
                expression: api/pedido/v2
        - log:
            message: "La API contestó ${header.CamelHttpResponseCode} para la orden ${variable.llave} correlacion=${variable.correlacion}"
