# Reintentar en el lugar (lección 19). Solo el router reintenta: los canales (int-rest, int-bd, int-edi) contestan
# lo que les pasó y ya; si cada pieza reintentara por su cuenta, los reintentos se multiplicarían.
#
#   intento 1 ✗ ─ 1 s ─ intento 2 ✗ ─ 2 s ─ intento 3 ✗ ─ 4 s ─ intento 4 ✓     (más o menos 15 % al azar)
#
# Se repite en el lugar: la espera detiene al consumidor de seda:repartir que lleva esa orden, así que lo que viene
# detrás en ESA orden espera su turno. Hasta la 23 había un solo consumidor, y mientras un destino no contestaba
# nadie más avanzaba; desde la 24 hay 10, y una orden atorada detiene a uno de ellos.
#
# Solo se repite lo que quedó «no se sabe» (sin respuesta o 5xx): direct:intentar lanza una IOException en ese caso.
# Un 4xx es un «no» del destino y no se repite. Agotados los reintentos, la operación pasa a
# conciliacion_pendiente (lección 20).
- routeConfiguration:
    id: reintentar-en-el-lugar
    onException:
      - onException:
          exception:
            - java.io.IOException
          redeliveryPolicy:
            maximumRedeliveries: 5
            redeliveryDelay: 1000
            useExponentialBackOff: true
            backOffMultiplier: 2
            useCollisionAvoidance: true
            collisionAvoidanceFactor: 0.15
            retryAttemptedLogLevel: WARN
            retriesExhaustedLogLevel: ERROR
          handled:
            constant:
              expression: "true"
          # Agotados los reintentos, NO es un fallo: seguimos sin saber. La operación pasa a conciliacion_pendiente
          # (alguien tiene que ir a ver al destino si quedó), y su último intento se queda en no_se_sabe.
          steps:
            - to:
                uri: "sql:UPDATE operacion SET estado = 'conciliacion_pendiente' WHERE id = :#${variable.operacion}"
                parameters:
                  dataSource: "#estado"
            - log:
                loggingLevel: WARN
                message: "Agoté los reintentos: orden ${variable.orden} momento ${variable.momento} canal ${variable.canal} queda en conciliacion_pendiente (no se sabe si llegó)"

# La ruta que hace cada intento no maneja sus errores: los deja subir a quien la llamó (enviar)
- routeConfiguration:
    id: sin-manejo
    errorHandler:
      noErrorHandler: {}
