# Reintentar (lección 19, y desde la 28 por Kafka). Solo el router reintenta: los canales cuentan lo que les pasó y
# ya; si cada pieza reintentara por su cuenta, los reintentos se multiplicarían.
#
#   intento 1 ✗ ─ 1 s ─ intento 2 ✗ ─ 2 s ─ intento 3 ✗ ─ 4 s ─ intento 4 ✓     (más o menos 15 % al azar)
#
# Hasta la 27 se repetía «en el lugar»: el router esperaba la respuesta del canal y, si no sabía cómo le había ido,
# volvía a llamar ahí mismo. Desde la 28 el router ya no espera a nadie: el «no se sabe» le llega como un desenlace
# (desenlaces.camel.yaml), y lo que se repite es la PUBLICACIÓN del evento, solo para ese canal, después de esperar.
# Mientras tanto no se detiene nada: los otros canales y las otras órdenes siguen.
#
# Solo se repite lo que quedó «no se sabe» (sin respuesta, un 5xx, o un 408, 425 o 429). Si el destino pidió una
# espera (Retry-After), desenlaces.camel.yaml la usa como espera, con un tope de 10 s. Cualquier otro 4xx es un «no»
# del destino y no se repite. A los seis intentos la operación pasa a conciliacion_pendiente (lección 20).
- route:
    id: reintentar
    from:
      uri: seda:reintentar
      parameters:
        concurrentConsumers: 10
      steps:
        # La espera no ocupa a nadie: asyncDelayed deja libre al consumidor de la cola mientras corre el reloj
        - delay:
            asyncDelayed: true
            expression:
              simple:
                expression: "${variable.espera}"
        # Se vuelve a publicar SOLO esa operación, si sigue sin saberse (un reproceso a mano pudo ganarle)
        - to:
            uri: "sql:SELECT estado FROM operacion WHERE id = CAST(:#${variable.operacion} AS bigint)"
            variableReceive: estado_ahora
            parameters:
              dataSource: "#estado"
              outputType: SelectOne
        - filter:
            expression:
              simple:
                expression: "${variable.estado_ahora} == 'no_se_sabe'"
            steps:
              - setVariable:
                  name: solo
                  expression:
                    simple:
                      expression: "${variable.operacion}"
              - to:
                  uri: direct:publicar

# Las rutas que publican no manejan sus errores: los dejan subir a quien las llamó
- routeConfiguration:
    id: sin-manejo
    errorHandler:
      noErrorHandler: {}
