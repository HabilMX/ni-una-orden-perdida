# La orden se convierte en un X12 850 y viaja al SFTP del socio comercial.
#   archivo de la orden → mapeo → plantilla → SFTP del socio (carpeta entrada/)
#
# Tres cuidados al depositar, porque el socio lee su carpeta en cualquier momento:
#   1) Nombre temporal mientras se escribe: el socio nunca ve un archivo a medias.
#   2) Nombre final determinístico (850-<orden>.edi): la misma orden siempre da el mismo nombre.
#   3) Sin sobrescribir: si ya existe, NO se pisa. Falla, y alguien decide (en la 18 verás cómo).
# Y uno al conectar: solo se habla con el servidor cuya llave está en known_hosts.
- route:
    id: orden-al-socio
    from:
      uri: file:entrada
      parameters:
        include: ".*\\.json"
      steps:
        - setVariable:
            name: orden
            expression:
              jsonpath:
                expression: "$.orden"
        - to:
            uri: jsonata:mappings/edi/850/v1/mapeo.jsonata
            parameters:
              inputType: JsonString
              outputType: JsonString
        - unmarshal:
            json: {}
        - to:
            uri: mustache:templates/edi/850/v1/850.mustache
        - to:
            uri: sftp://socio@socio-sftp:22/entrada
            parameters:
              password: "{{env:SFTP_CLAVE:practica}}"   # de práctica; en la vida real, una llave o un gestor de secretos
              knownHostsFile: known_hosts
              strictHostKeyChecking: "yes"              # sin la llave del socio anotada, no se conecta
              fileName: "850-${variable.orden}.edi"     # 2) determinístico
              tempFileName: "${file:onlyname.noext}.tmp" # 1) mientras se escribe, se llama .tmp
              fileExist: Fail                           # 3) si ya existe, no se pisa
        - log:
            message: "Dejé el 850 de la orden ${variable.orden} en el SFTP del socio"
