# int-edi, segundo momento: el embarque. Le avisa al socio que su orden salió, con un X12 856 (aviso de embarque),
# y lo deja en su SFTP con los mismos cuatro cuidados del 850 (lección 07): nombre temporal, nombre final
# determinístico (856-<orden>.edi), sin pisar uno que ya está y solo con la llave anotada en known_hosts.
# El mapeo calcula, la plantilla solo acomoda: igual que con el 850.
- route:
    id: int-edi-embarque
    from:
      uri: platform-http:/embarque
      parameters:
        httpMethodRestrict: POST
      steps:
        - setVariable:
            name: orden
            expression:
              simple:
                expression: "${header.ce-subject}"
        - setVariable:
            name: correlacion
            expression:
              simple:
                expression: "${header.ce-correlationid}"
        - to:
            uri: jsonata:mappings/edi/856/v1/mapeo.jsonata
            parameters:
              inputType: JsonString
              outputType: JsonString
        - unmarshal:
            json: {}
        - to:
            uri: mustache:templates/edi/856/v1/856.mustache
        - removeHeaders:
            pattern: "*"
        - to:
            uri: sftp://socio@socio-sftp:22/entrada
            parameters:
              password: "{{env:SFTP_CLAVE:practica}}"
              knownHostsFile: known_hosts
              strictHostKeyChecking: "yes"
              fileName: "856-${variable.orden}.edi"
              tempFileName: "${file:onlyname.noext}.tmp"
              fileExist: Fail
        - log:
            message: "Dejé el 856 de la orden ${variable.orden} en el SFTP del socio correlacion=${variable.correlacion}"
        - setBody:
            expression:
              simple:
                expression: '{"canal":"socio","archivo":"856-${variable.orden}.edi","resultado":"DEPOSITADO"}'
