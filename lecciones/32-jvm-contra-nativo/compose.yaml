# La lección 32: el MISMO int-rest de la 31, en dos imágenes, una para la JVM y otra nativa, lado a lado.
# Las dos se construyen con el Dockerfile de la 31 (cambia solo la etapa final, «target») y llaman a la misma API.
# Este archivo NO se toca: lo que haces en esta lección vive en tu carpeta (medir).
#
#   docker compose build int-rest-jvm int-rest-nativo     (la nativa tarda varios minutos: es la parte cara)
#   docker compose up -d api-pedidos int-rest-jvm          (o int-rest-nativo)
#
# NO usa el ambiente de la 00: trae su propia API y su propia red, así no choca con las otras lecciones.
name: practica-retail-l32

x-int-rest: &int-rest
  depends_on: [api-pedidos]
  # Los dos con el mismo techo de CPU y memoria, para que la comparación sea justa
  cpus: 1
  mem_limit: 512m

services:
  # La API de pedidos de la lección 00, con el nombre que la ruta espera: api-pedidos
  api-pedidos:
    build: ../../infra/api-demo
    image: ni-una-orden-perdida/api-demo:1.5.0
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /q/health/ready HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 2s
      retries: 40

  int-rest-jvm:
    <<: *int-rest
    build:
      context: ../31-de-laboratorio-a-kubernetes/int-rest
      dockerfile: ../Dockerfile
      target: jvm
    image: ni-una-orden-perdida/int-rest:jvm
    ports: ["8091:8080"]

  int-rest-nativo:
    <<: *int-rest
    build:
      context: ../31-de-laboratorio-a-kubernetes/int-rest
      dockerfile: ../Dockerfile
      target: nativo
    image: ni-una-orden-perdida/int-rest:nativo
    ports: ["8092:8080"]

  # El que manda la carga corta (fortio, el mismo de la 31). Solo corre cuando se le pide:
  #   docker compose run --rm carga load -qps 100 -c 4 -t 20s … http://int-rest-jvm:8080/integrar
  carga:
    image: fortio/fortio:1.76.0
    profiles: [carga]
    volumes:
      - ../../datos/ordenes:/ordenes:ro
