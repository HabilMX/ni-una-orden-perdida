# La orden llega por HTTP y se registra en el ERP:
#   POST /ordenes → traducir a filas → insertar cabecera → insertar cada renglón de detalle → llamar registrar_pedido
#
# El controlador (driver) de MariaDB, que Camel necesita para hablar con el ERP, viene en dependencias.txt.

# La conexión al ERP. La contraseña es de práctica; en un sistema real llega por variable o por un gestor de secretos.
- beans:
    - name: erp
      type: org.mariadb.jdbc.MariaDbDataSource
      properties:
        url: "jdbc:mariadb://erp:3306/erp"
        user: integracion
        password: "{{env:ERP_CLAVE:practica}}"

- route:
    id: orden-al-erp
    from:
      uri: platform-http:/ordenes
      parameters:
        httpMethodRestrict: POST
      steps:
        - to:
            uri: jsonata:mappings/erp/pedido/v1/mapeo.jsonata
            parameters:
              inputType: JsonString
              outputType: JsonString
        # De texto JSON a datos (mapas y listas), para poder usar sus campos en el SQL
        - unmarshal:
            json: {}
        # Guardamos las filas en variables: el cuerpo va a cambiar con cada paso
        - setVariable:
            name: cabecera
            simple: "${body[cabecera]}"
        - setVariable:
            name: detalle
            simple: "${body[detalle]}"
        - log:
            message: "Registrando en el ERP el pedido ${variable.cabecera[pedido]} con ${variable.detalle.size()} renglones"

        # 1) La cabecera
        - setBody:
            simple: "${variable.cabecera}"
        - to:
            uri: sql:INSERT INTO pedido_cabecera (pedido, tienda, fecha, total) VALUES (:#pedido, :#tienda, :#fecha, :#total)
            parameters:
              dataSource: "#erp"

        # 2) TE TOCA: un INSERT por cada renglón del detalle.
        #    Pista: «split» recorre una lista; la lista está en ${variable.detalle}.
        #    Cada renglón trae pedido, posicion, sku, cantidad y precio.

        # 3) TE TOCA: llamar al procedimiento registrar_pedido con el número de pedido.
        #    Él comprueba que el total cuadre con el detalle y marca el pedido REGISTRADO.

        - setBody:
            simple: '{"pedido":"${variable.cabecera[pedido]}","erp":"REGISTRADO"}'
