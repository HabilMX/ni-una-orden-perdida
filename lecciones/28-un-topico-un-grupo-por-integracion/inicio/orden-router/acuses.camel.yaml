# Enviado no es confirmado (lección 21). Que el 850 quedó en el SFTP del socio («aceptada») dice que lo
# DEPOSITAMOS, no que el socio lo recibió y lo entiende. Eso lo dice su acuse funcional, el 997, que llega después
# y por otro camino: el socio lo deja en salida/, en su SFTP.
#
#   850 → entrada/ … (segundos, u horas en la vida real) … salida/997-<GS06>.edi → router → confirmada | rechazada
#
# El 997 no trae el número de orden. Se correlaciona con su operación por los números de control que mandamos:
#   AK1-02 = el GS06 del grupo   → operacion.numero_control (el que asigna el router desde la 15)
#   AK2-01 / AK2-02 = el ST01 y el ST02 del documento → qué documento (850, 856, 214) y cuál dentro del grupo
# El ISA13 del 997 es del socio: no sirve para correlacionar.
#
# El router tiene una sola copia, así que este sondeo corre una vez (como el de la bodega, lección 13).

# El sondeo de los acuses: cada 997 se lee, se traduce con su mapeo y se correlaciona
- route:
    id: sondeo-acuses
    from:
      uri: sftp://socio@socio-sftp:22/salida
      parameters:
        password: "{{env:SFTP_CLAVE:practica}}"
        knownHostsFile: known_hosts
        strictHostKeyChecking: "yes"
        include: "997-.*\\.edi"
        move: .leidos
        delay: 2000
      steps:
        - convertBodyTo:
            type: String
        - setVariable:
            name: archivo
            expression:
              simple:
                expression: "${header.CamelFileName}"
        # El texto del 997 como cadena JSON, para que el mapeo lo lea
        - marshal:
            json: {}
        - to:
            uri: jsonata:mappings/edi/997/v1/mapeo.jsonata
            parameters:
              inputType: JsonString
              outputType: JsonString
        # Lo que dijo el mapeo, como texto: de ahí salen sus errores para la tabla acuse
        - setVariable:
            name: leido
            expression:
              simple:
                expression: "${body}"
        - unmarshal:
            json: {}
        - log:
            message: "Llegó el 997 ${variable.archivo}: acusa el ${body[documento][tipo]} del grupo ${body[grupo][control]} con ${body[acuse]}"
        - to:
            uri: direct:correlacionar-acuse

# Correlacionar: cada acuse se anota en la tabla acuse; si corresponde a una operación del socio que esperaba
# su acuse («aceptada»), esa operación pasa a confirmada (AK5 = A) o a rechazada (AK5 = R), en la misma instrucción.
- route:
    id: correlacionar-acuse
    from:
      uri: direct:correlacionar-acuse
      steps:
        - to:
            uri: >-
              sql:WITH op AS (
                UPDATE operacion SET estado = CASE WHEN CAST(:#${body[acuse]} AS text) = 'R' THEN 'rechazada' ELSE 'confirmada' END
                WHERE canal = 'edi' AND estado = 'aceptada'
                  AND numero_control = CAST(:#${body[grupo][control]} AS text)
                  AND momento = CASE CAST(:#${body[documento][tipo]} AS text)
                                WHEN '850' THEN 'creada' WHEN '856' THEN 'embarcada' WHEN '214' THEN 'entregada' END
                  AND CASE CAST(:#${body[grupo][tipo]} AS text) WHEN 'PO' THEN '850' WHEN 'SH' THEN '856' WHEN 'QM' THEN '214' END
                      = CAST(:#${body[documento][tipo]} AS text)
                  AND CAST(:#${body[documento][control]} AS text) = '0001'
                RETURNING id, orden, momento, estado)
              INSERT INTO acuse (archivo, control_socio, grupo_tipo, grupo_control, documento_tipo, documento_control,
                                 codigo, errores, operacion)
              SELECT :#${variable.archivo}, :#${body[socio][control]}, :#${body[grupo][tipo]}, :#${body[grupo][control]},
                     :#${body[documento][tipo]}, :#${body[documento][control]}, :#${body[acuse]},
                     CAST(:#${variable.leido} AS jsonb) -> 'errores', (SELECT id FROM op)
              RETURNING COALESCE((SELECT orden || ' ' || momento || ' → ' || estado FROM op), '') AS resultado
            variableReceive: correlacion997
            parameters:
              dataSource: "#estado"
              outputType: SelectOne
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${variable.correlacion997} == ''"
                steps:
                  - log:
                      loggingLevel: WARN
                      message: "El 997 ${variable.archivo} no corresponde a ninguna operación que esperara su acuse (grupo ${body[grupo][control]}, documento ${body[documento][tipo]} ${body[documento][control]}): queda en la tabla acuse, sin operación"
            otherwise:
              steps:
                - log:
                    message: "El 997 ${variable.archivo} confirma lo enviado: orden ${variable.correlacion997}"
