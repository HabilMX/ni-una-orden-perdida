# El reparto: lo que ya se guardó sale a sus canales, uno por uno, por la cola interna seda:repartir.
#
# Para cada operación pendiente del momento que llegó:
#   1. se lee de la BASE lo que hay que mandar (no de la memoria): lo guardado es lo que sale;
#   2. se escribe el INTENTO antes de enviar, con la huella (sha256) y el tamaño de lo que va a salir.
#      Si el router se cae justo después de enviar, en la base queda que lo intentó y no sabe cómo le fue.
#      («En la 20 verás por qué.»)
#   3. se llama al servicio del canal y se anota el desenlace en el intento y en la operación:
#      2xx aceptada · 4xx rechazada · otro código o sin respuesta: no_se_sabe.
#
# Esta parte viene hecha. No la tienes que escribir; sí léela: es lo que hace el router después del 202.

- route:
    id: repartir
    from:
      uri: seda:repartir
      steps:
        - log:
            message: "Reparto el momento ${variable.momento} de la orden ${variable.orden} correlacion=${variable.correlacion}"
        # Lo que hay que mandar a cada canal, según el momento: la orden, su embarque o su entrega.
        # De dónde vino también se lee de ahí, para el ce-source del sobre.
        - to:
            uri: >-
              sql:SELECT p.id, p.canal, p.momento, p.numero_control, p.correlacion,
              CASE p.momento WHEN 'creada' THEN (o.datos - 'embarque' - 'entrega')::text
                             WHEN 'embarcada' THEN (o.datos -> 'embarque')::text
                             ELSE (o.datos -> 'entrega')::text END AS datos,
              CASE p.momento WHEN 'creada' THEN '/tiendas/' || (o.datos ->> 'tienda')
                             WHEN 'embarcada' THEN '/bodegas/' || (o.datos -> 'embarque' ->> 'bodega')
                             ELSE '/paqueterias/' || (o.datos -> 'entrega' ->> 'paqueteria') END AS fuente
              FROM operacion p JOIN orden o ON o.orden = p.orden
              WHERE p.orden = :#${variable.orden} AND p.momento = :#${variable.momento} AND p.estado = 'pendiente'
              ORDER BY p.id
            parameters:
              dataSource: "#estado"
        - split:
            expression:
              simple:
                expression: "${body}"
            steps:
              - to:
                  uri: direct:enviar

# Una operación: intento → llamada → desenlace. El cuerpo llega como la fila de la consulta de arriba.
- route:
    id: enviar
    from:
      uri: direct:enviar
      steps:
        - setVariable:
            name: operacion
            expression:
              simple:
                expression: "${body[id]}"
        - setVariable:
            name: canal
            expression:
              simple:
                expression: "${body[canal]}"
        - setVariable:
            name: momento
            expression:
              simple:
                expression: "${body[momento]}"
        - setVariable:
            name: control
            expression:
              simple:
                expression: "${body[numero_control]}"
        - setVariable:
            name: correlacion
            expression:
              simple:
                expression: "${body[correlacion]}"
        - setVariable:
            name: fuente
            expression:
              simple:
                expression: "${body[fuente]}"
        # Qué servicio atiende el canal, y en qué paso del servicio entra este momento
        - setVariable:
            name: servicio
            expression:
              simple:
                expression: "${variable.canal == 'rest' ? 'int-rest' : ${variable.canal} == 'bd' ? 'int-bd' : 'int-edi'}"
        - setVariable:
            name: paso
            expression:
              simple:
                expression: "${variable.momento == 'creada' ? 'integrar' : ${variable.momento} == 'embarcada' ? 'embarque' : 'entrega'}"
        - setBody:
            expression:
              simple:
                expression: "${body[datos]}"
        # 2. El intento, ANTES de enviar: número, huella, tamaño. Su desenlace queda vacío hasta saberlo.
        #    Ojo: la consulta va dentro de una dirección (URI), y ahí un «+» se lee como espacio. Por eso el
        #    «más uno» se escribe %2B.
        - to:
            uri: >-
              sql:INSERT INTO intento (operacion, n, tamano, sha256)
              VALUES (:#${variable.operacion},
                      (SELECT COALESCE(MAX(n), 0) %2B 1 FROM intento WHERE operacion = :#${variable.operacion}),
                      octet_length(convert_to(:#${body}, 'UTF8')),
                      encode(sha256(convert_to(:#${body}, 'UTF8')), 'hex'))
              RETURNING id
            variableReceive: intento
            parameters:
              dataSource: "#estado"
              outputType: SelectOne
        # El sobre, igual que desde la 08: ahora con el momento de esta operación
        - removeHeaders:
            pattern: "*"
        - setHeader:
            name: ce-specversion
            expression:
              constant:
                expression: "1.0"
        - setHeader:
            name: ce-type
            expression:
              simple:
                expression: "mx.tienda.orden.${variable.momento}"
        - setHeader:
            name: ce-source
            expression:
              simple:
                expression: "${variable.fuente}"
        - setHeader:
            name: ce-subject
            expression:
              simple:
                expression: "${variable.orden}"
        - setHeader:
            name: ce-id
            expression:
              simple:
                expression: "orden-${variable.orden}-${variable.momento}"
        - setHeader:
            name: ce-correlationid
            expression:
              simple:
                expression: "${variable.correlacion}"
        # Solo el canal del socio lleva número de control: el que le dio la secuencia de la base al guardar
        - filter:
            expression:
              simple:
                expression: "${variable.control} != null"
            steps:
              - setHeader:
                  name: ce-numerocontrol
                  expression:
                    simple:
                      expression: "${variable.control}"
        - setHeader:
            name: Content-Type
            expression:
              constant:
                expression: application/json
        # 3. La llamada al canal, y su desenlace
        - doTry:
            steps:
              - toD:
                  uri: "http://${variable.servicio}:8080/${variable.paso}"
                  parameters:
                    httpMethod: POST
                    throwExceptionOnFailure: false
              - setVariable:
                  name: codigo
                  expression:
                    simple:
                      expression: "${header.CamelHttpResponseCode}"
              - setVariable:
                  name: version
                  expression:
                    simple:
                      expression: "${header.X-Version-Mapeo}"
              - setVariable:
                  name: respuesta
                  expression:
                    simple:
                      expression: "${bodyAs(String)}"
            doCatch:
              - exception:
                  - java.lang.Exception
                steps:
                  - setVariable:
                      name: codigo
                      expression:
                        constant:
                          expression: "0"
                  - setVariable:
                      name: respuesta
                      expression:
                        simple:
                          expression: "${exception.class.simpleName}: ${exception.message}"
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${variable.codigo} range '200..299'"
                steps:
                  - setVariable:
                      name: desenlace
                      expression:
                        constant:
                          expression: aceptada
              - expression:
                  simple:
                    expression: "${variable.codigo} range '400..499'"
                steps:
                  - setVariable:
                      name: desenlace
                      expression:
                        constant:
                          expression: rechazada
            otherwise:
              steps:
                - setVariable:
                    name: desenlace
                    expression:
                      constant:
                        expression: no_se_sabe
        - to:
            uri: >-
              sql:UPDATE intento SET desenlace = :#${variable.desenlace}, version_mapeo = :#${variable.version},
              respuesta = jsonb_build_object('codigo', CAST(:#${variable.codigo} AS int), 'cuerpo', CAST(:#${variable.respuesta} AS text)),
              fin = now() WHERE id = :#${variable.intento}
            parameters:
              dataSource: "#estado"
        - to:
            uri: "sql:UPDATE operacion SET estado = :#${variable.desenlace} WHERE id = :#${variable.operacion}"
            parameters:
              dataSource: "#estado"
        - log:
            message: "Orden ${variable.orden} momento ${variable.momento} canal ${variable.canal}: ${variable.servicio} contestó ${variable.codigo}, queda ${variable.desenlace} correlacion=${variable.correlacion}"
        # Un canal aceptó un momento: puede que algo estacionado lo estuviera esperando. Es el EVENTO que dispara
        # el barrido (lección 17): no se revisa cada tanto, se revisa cuando algo cambió.
        - filter:
            expression:
              simple:
                expression: "${variable.desenlace} == 'aceptada'"
            steps:
              - to:
                  uri: direct:barrido
