# El reparto: lo que ya se guardó sale a sus canales, uno por uno, por la cola interna seda:repartir.
#
# Para cada operación pendiente del momento que llegó:
#   1. se lee de la BASE lo que hay que mandar (no de la memoria): lo guardado es lo que sale;
#   2. se escribe el INTENTO antes de enviar, con la huella (sha256) y el tamaño de lo que va a salir.
#      Si el router se cae justo después de enviar, en la base queda que lo intentó y no sabe cómo le fue.
#      («En la 20 verás por qué.»)
#   3. se llama al servicio del canal y se anota el desenlace en el intento y en la operación:
#      2xx aceptada · otro 4xx rechazada · 408, 425, 429, otro código o sin respuesta: no_se_sabe.
#
# Esta parte viene hecha. No la tienes que escribir; sí léela: es lo que hace el router después del 202.
# Desde la 19, cada intento es su propia ruta (intentar), para que un «no se sabe» se repita completo, con su
# renglón en intento (ver reintentos.camel.yaml).
# Desde la 23, lo que una operación necesita para salir lo prepara su propia ruta (preparar): así el reproceso a
# mano (rerun.camel.yaml) arma el intento con las mismas piezas que el reparto, sin copiarlas.

# Desde la 24 el reparto atiende hasta 10 órdenes a la vez (concurrentConsumers): cuando la tienda manda un lote,
# una por una tardaría lo que tarde el destino más lento por cada orden. Las operaciones de UNA orden siguen saliendo
# en fila. Que dos momentos de la misma orden se crucen no rompe nada: lo que llega antes de tiempo se estaciona al
# recibirse (lección 17). El precio: ahora el router le puede mandar 10 a la vez a un destino (ver int-bd).
- route:
    id: repartir
    from:
      uri: seda:repartir
      parameters:
        concurrentConsumers: 10
      steps:
        - log:
            message: "Reparto el momento ${variable.momento} de la orden ${variable.orden} correlacion=${variable.correlacion}"
        # Lo que hay que mandar a cada canal, según el momento: la orden, su embarque o su entrega.
        # De dónde vino también se lee de ahí, para el ce-source del sobre.
        - to:
            uri: >-
              sql:SELECT p.id, p.canal, p.momento, p.numero_control, p.correlacion,
              CASE p.momento WHEN 'creada' THEN (o.datos - 'embarque' - 'entrega')::text
                             WHEN 'embarcada' THEN (o.datos -> 'embarque')::text
                             ELSE (o.datos -> 'entrega')::text END AS datos,
              CASE p.momento WHEN 'creada' THEN '/tiendas/' || (o.datos ->> 'tienda')
                             WHEN 'embarcada' THEN '/bodegas/' || (o.datos -> 'embarque' ->> 'bodega')
                             ELSE '/paqueterias/' || (o.datos -> 'entrega' ->> 'paqueteria') END AS fuente
              FROM operacion p JOIN orden o ON o.orden = p.orden
              WHERE p.orden = :#${variable.orden} AND p.momento = :#${variable.momento} AND p.estado = 'pendiente'
              ORDER BY p.id
            parameters:
              dataSource: "#estado"
        - split:
            expression:
              simple:
                expression: "${body}"
            steps:
              - to:
                  uri: direct:enviar

# Una operación: intento → llamada → desenlace. El cuerpo llega como la fila de la consulta de arriba.
- route:
    id: enviar
    # Si el intento no supo cómo le fue, se repite AQUÍ mismo (reintentos.camel.yaml): toda la llamada a
    # direct:intentar otra vez, con su propio renglón en intento. Mientras tanto, la cola espera.
    routeConfigurationId: reintentar-en-el-lugar
    from:
      uri: direct:enviar
      steps:
        - to:
            uri: direct:preparar
        # 2 y 3. Un intento: renglón en intento, llamada y desenlace. Si queda «no se sabe», intentar lanza un
        #        error y la configuración de reintentos lo vuelve a llamar, con espera creciente.
        - to:
            uri: direct:intentar
        # Un canal aceptó un momento: puede que algo estacionado lo estuviera esperando. Es el EVENTO que dispara
        # el barrido (lección 17): no se revisa cada tanto, se revisa cuando algo cambió.
        - filter:
            expression:
              simple:
                expression: "${variable.desenlace} == 'aceptada'"
            steps:
              - to:
                  uri: direct:barrido

# Lo que una operación necesita para salir, a partir de su fila (la de la consulta de repartir): qué es, a qué
# servicio va, en qué paso entra y qué datos lleva. Lo usan el reparto (enviar) y el reproceso a mano (rerun).
- route:
    id: preparar
    from:
      uri: direct:preparar
      steps:
        - setVariable:
            name: operacion
            expression:
              simple:
                expression: "${body[id]}"
        - setVariable:
            name: canal
            expression:
              simple:
                expression: "${body[canal]}"
        - setVariable:
            name: momento
            expression:
              simple:
                expression: "${body[momento]}"
        - setVariable:
            name: control
            expression:
              simple:
                expression: "${body[numero_control]}"
        - setVariable:
            name: correlacion
            expression:
              simple:
                expression: "${body[correlacion]}"
        - setVariable:
            name: fuente
            expression:
              simple:
                expression: "${body[fuente]}"
        # Qué servicio atiende el canal, y en qué paso del servicio entra este momento
        - setVariable:
            name: servicio
            expression:
              simple:
                expression: "${variable.canal == 'rest' ? 'int-rest' : ${variable.canal} == 'bd' ? 'int-bd' : 'int-edi'}"
        - setVariable:
            name: paso
            expression:
              simple:
                expression: "${variable.momento == 'creada' ? 'integrar' : ${variable.momento} == 'embarcada' ? 'embarque' : 'entrega'}"
        - setBody:
            expression:
              simple:
                expression: "${body[datos]}"
        - setVariable:
            name: datos
            expression:
              simple:
                expression: "${body}"

# Un intento: el renglón ANTES de enviar, la llamada al canal y su desenlace. No maneja sus errores: los deja
# subir a enviar, que es quien decide si se repite.
- route:
    id: intentar
    routeConfigurationId: sin-manejo
    from:
      uri: direct:intentar
      steps:
        - setBody:
            expression:
              simple:
                expression: "${variable.datos}"
        # 2. El intento, ANTES de enviar: número, huella, tamaño. Su desenlace queda vacío hasta saberlo.
        #    Ojo: la consulta va dentro de una dirección (URI), y ahí un «+» se lee como espacio. Por eso el
        #    «más uno» se escribe %2B.
        #    El tipo dice quién lo pidió: «auto» el reparto, «manual» una persona con POST /rerun (lección 23), que
        #    deja además su nombre y su motivo. El reparto no pone esas variables, y quedan vacías.
        #    El número n es único por operación: si dos intentos de la misma operación arrancan a la vez, el segundo
        #    no entra (y no se envía).
        - to:
            uri: >-
              sql:INSERT INTO intento (operacion, n, tipo, pedido_por, motivo, tamano, sha256)
              VALUES (:#${variable.operacion},
                      (SELECT COALESCE(MAX(n), 0) %2B 1 FROM intento WHERE operacion = :#${variable.operacion}),
                      COALESCE(CAST(:#${variable.tipo} AS text), 'auto'),
                      CAST(:#${variable.pedido_por} AS text), CAST(:#${variable.motivo} AS text),
                      octet_length(convert_to(:#${body}, 'UTF8')),
                      encode(sha256(convert_to(:#${body}, 'UTF8')), 'hex'))
              RETURNING id
            variableReceive: intento
            parameters:
              dataSource: "#estado"
              outputType: SelectOne
        # El sobre, igual que desde la 08: ahora con el momento de esta operación
        - removeHeaders:
            pattern: "*"
        - setHeader:
            name: ce-specversion
            expression:
              constant:
                expression: "1.0"
        - setHeader:
            name: ce-type
            expression:
              simple:
                expression: "mx.tienda.orden.${variable.momento}"
        - setHeader:
            name: ce-source
            expression:
              simple:
                expression: "${variable.fuente}"
        - setHeader:
            name: ce-subject
            expression:
              simple:
                expression: "${variable.orden}"
        - setHeader:
            name: ce-id
            expression:
              simple:
                expression: "orden-${variable.orden}-${variable.momento}"
        - setHeader:
            name: ce-correlationid
            expression:
              simple:
                expression: "${variable.correlacion}"
        # Solo el canal del socio lleva número de control: el que le dio la secuencia de la base al guardar
        - filter:
            expression:
              simple:
                expression: "${variable.control} != null"
            steps:
              - setHeader:
                  name: ce-numerocontrol
                  expression:
                    simple:
                      expression: "${variable.control}"
        - setHeader:
            name: Content-Type
            expression:
              constant:
                expression: application/json
        # 3. La llamada al canal, y su desenlace
        # 3. La llamada al canal, detrás de SU cortacircuito (lección 22). Uno por canal: si el SFTP del socio se cae,
        #    se abre el de edi y los de rest y bd siguen cerrados.
        #      cerrado     → se llama; con 2 llamadas o más y la mitad fallando (de las últimas 4), se abre
        #      abierto     → NO se llama: se contesta al momento que no se intentó (durante 10 s)
        #      medio abierto → pasados los 10 s, se deja pasar una llamada de prueba: si sale bien, se cierra
        #    Los tres llevan la misma configuración, escrita en cada uno para que se lea completa.
        - setVariable:
            name: codigo
            expression:
              constant:
                expression: "0"
        - setVariable:
            name: respuesta
            expression:
              constant:
                expression: ""
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${variable.canal} == 'rest'"
                steps:
                  - circuitBreaker:
                      id: cortacircuito-rest
                      resilience4jConfiguration:
                        slidingWindowSize: 4
                        minimumNumberOfCalls: 2
                        failureRateThreshold: 50
                        waitDurationInOpenState: "10000"
                        permittedNumberOfCallsInHalfOpenState: 1
                        automaticTransitionFromOpenToHalfOpenEnabled: true
                      steps:
                        - to:
                            uri: direct:llamar-canal
                      onFallback:
                        steps:
                          - to:
                              uri: direct:sin-respuesta
              - expression:
                  simple:
                    expression: "${variable.canal} == 'bd'"
                steps:
                  - circuitBreaker:
                      id: cortacircuito-bd
                      resilience4jConfiguration:
                        slidingWindowSize: 4
                        minimumNumberOfCalls: 2
                        failureRateThreshold: 50
                        waitDurationInOpenState: "10000"
                        permittedNumberOfCallsInHalfOpenState: 1
                        automaticTransitionFromOpenToHalfOpenEnabled: true
                      steps:
                        - to:
                            uri: direct:llamar-canal
                      onFallback:
                        steps:
                          - to:
                              uri: direct:sin-respuesta
              - expression:
                  simple:
                    expression: "${variable.canal} == 'edi'"
                steps:
                  - circuitBreaker:
                      id: cortacircuito-edi
                      resilience4jConfiguration:
                        slidingWindowSize: 4
                        minimumNumberOfCalls: 2
                        failureRateThreshold: 50
                        waitDurationInOpenState: "10000"
                        permittedNumberOfCallsInHalfOpenState: 1
                        automaticTransitionFromOpenToHalfOpenEnabled: true
                      steps:
                        - to:
                            uri: direct:llamar-canal
                      onFallback:
                        steps:
                          - to:
                              uri: direct:sin-respuesta
        # El desenlace se decide por la EVIDENCIA, no por lo que uno espera (lección 20):
        #   2xx               → aceptada:   el destino dijo que sí.
        #   408, 425, 429     → no_se_sabe: son 4xx, pero no son un «no»: dicen «ahora no, prueba después».
        #                                   429, «me mandaste demasiadas en poco tiempo» (RFC 6585); 408, «me
        #                                   cansé de esperar a que terminaras de mandarla» (RFC 9110); 425, «es muy
        #                                   pronto para atender esto» (RFC 8470). Repetir, esperando, sí sirve; si
        #                                   el destino dice cuánto esperar (Retry-After), se espera eso (abajo).
        #   otro 4xx          → rechazada:  el destino dijo que no (una regla de negocio, una llave reusada). Repetir
        #                                   da la misma respuesta: no se reintenta.
        #   5xx, 504, sin respuesta (codigo 0) → no_se_sabe: el destino no dijo nada claro. Pudo haber escrito
        #                                   (la API lenta registra DESPUÉS de que cortamos). No es un fallo:
        #                                   se reintenta, y si se agota, queda en conciliacion_pendiente.
        #   -1 (cortacircuito abierto) → no_enviado: NO se llamó al destino; la operación sigue pendiente (lección 22)
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${variable.codigo} == -1"
                steps:
                  - setVariable:
                      name: desenlace
                      expression:
                        constant:
                          expression: no_enviado
              - expression:
                  simple:
                    expression: "${variable.codigo} range '200..299'"
                steps:
                  - setVariable:
                      name: desenlace
                      expression:
                        constant:
                          expression: aceptada
              # 408, 425 y 429 son 4xx, pero no son un «no»: dicen «ahora no, prueba después» (ver arriba). Van ANTES
              # del 400..499 porque el choice se queda con el primer when que se cumple.
              - expression:
                  simple:
                    expression: "${variable.codigo} in '408,425,429'"
                steps:
                  - setVariable:
                      name: desenlace
                      expression:
                        constant:
                          expression: no_se_sabe
              - expression:
                  simple:
                    expression: "${variable.codigo} range '400..499'"
                steps:
                  - setVariable:
                      name: desenlace
                      expression:
                        constant:
                          expression: rechazada
            otherwise:
              steps:
                - setVariable:
                    name: desenlace
                    expression:
                      constant:
                        expression: no_se_sabe
        # Si el destino contestó 408, 425 o 429 y dijo cuánto esperar (Retry-After, en segundos), el siguiente
        # reintento espera eso en vez de la espera creciente de reintentos.camel.yaml: es el destino el que sabe cuándo
        # puede atender. Con un tope de 10 s, de la práctica: así un Retry-After de una hora no detiene la práctica; un
        # sistema real fija su tope según cuánto puede esperar. Si viene como fecha y no en segundos, o no viene, se usa
        # la espera de siempre. CamelRedeliveryDelay es el encabezado con el que Camel deja cambiar esa espera.
        - removeHeader:
            name: CamelRedeliveryDelay
        - filter:
            expression:
              simple:
                expression: "${variable.codigo} in '408,425,429' && ${variable.espera_pedida} regex '[0-9]{1,6}'"
            steps:
              - setHeader:
                  name: CamelRedeliveryDelay
                  expression:
                    simple:
                      # De segundos a milisegundos: 3 → 3000
                      expression: "${variable.espera_pedida}000"
              - filter:
                  expression:
                    simple:
                      expression: "${variable.espera_pedida} > 10"
                  steps:
                    - setHeader:
                        name: CamelRedeliveryDelay
                        expression:
                          constant:
                            expression: "10000"
              - log:
                  message: "${variable.servicio} contestó ${variable.codigo} y pidió esperar ${variable.espera_pedida} s (Retry-After): el siguiente intento de la orden ${variable.orden} sale en ${header.CamelRedeliveryDelay} ms"
        - to:
            uri: >-
              sql:UPDATE intento SET desenlace = :#${variable.desenlace}, version_mapeo = :#${variable.version},
              respuesta = jsonb_build_object('codigo', CAST(:#${variable.codigo} AS int), 'cuerpo', CAST(:#${variable.respuesta} AS text)),
              fin = now() WHERE id = :#${variable.intento}
            parameters:
              dataSource: "#estado"
        - to:
            # Lo que no se envió (cortacircuito abierto) sigue pendiente: no le pasó nada en el destino
            uri: "sql:UPDATE operacion SET estado = CASE WHEN CAST(:#${variable.desenlace} AS text) = 'no_enviado' THEN 'pendiente' ELSE CAST(:#${variable.desenlace} AS text) END WHERE id = :#${variable.operacion}"
            parameters:
              dataSource: "#estado"
        - log:
            message: "Orden ${variable.orden} momento ${variable.momento} canal ${variable.canal}: ${variable.servicio} contestó ${variable.codigo}, queda ${variable.desenlace} correlacion=${variable.correlacion}"
        # «No se sabe» es lo único que vale la pena repetir: el destino no dijo que no. Se avisa con un error
        # para que la política de reintentos de enviar vuelva a llamar a esta ruta.
        - filter:
            expression:
              simple:
                expression: "${variable.desenlace} == 'no_se_sabe'"
            steps:
              - throwException:
                  exceptionType: java.io.IOException
                  message: "No se sabe si ${variable.servicio} recibió la orden ${variable.orden} momento ${variable.momento} (contestó ${variable.codigo})"

# La llamada a un canal, dentro de su cortacircuito. Un 5xx cuenta como falla del canal (lanza un error que el
# cortacircuito anota); un 4xx no, ni siquiera un 429: el canal contestó, y su «prueba después» lo atiende el
# reintento con espera. No maneja sus errores.
- route:
    id: llamar-canal
    routeConfigurationId: sin-manejo
    from:
      uri: direct:llamar-canal
      steps:
        # Lo que pida esperar el destino (Retry-After) se lee de su respuesta; si no contesta, no pidió nada
        - setVariable:
            name: espera_pedida
            expression:
              constant:
                expression: ""
        - toD:
            uri: "http://${variable.servicio}:8080/${variable.paso}"
            parameters:
              httpMethod: POST
              throwExceptionOnFailure: false
        - setVariable:
            name: codigo
            expression:
              simple:
                expression: "${header.CamelHttpResponseCode}"
        - setVariable:
            name: espera_pedida
            expression:
              simple:
                expression: "${header.Retry-After}"
        - setVariable:
            name: version
            expression:
              simple:
                expression: "${header.X-Version-Mapeo}"
        - setVariable:
            name: respuesta
            expression:
              simple:
                expression: "${bodyAs(String)}"
        - filter:
            expression:
              simple:
                expression: "${variable.codigo} >= 500"
            steps:
              - throwException:
                  exceptionType: java.io.IOException
                  message: "${variable.servicio} contestó ${variable.codigo}"

# Cuando la llamada falló o el cortacircuito está abierto. Lo que pasó lo deja el cortacircuito en la propiedad
# CamelExceptionCaught: si es CallNotPermittedException, estaba abierto y NO se llamó (codigo -1); si es otra cosa,
# se llamó y falló (se queda codigo 0: no se supo, y el motivo va en la respuesta).
- route:
    id: sin-respuesta
    from:
      uri: direct:sin-respuesta
      steps:
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${exchangeProperty.CamelExceptionCaught} is 'io.github.resilience4j.circuitbreaker.CallNotPermittedException'"
                steps:
                  - setVariable:
                      name: codigo
                      expression:
                        constant:
                          expression: "-1"
                  - setVariable:
                      name: respuesta
                      expression:
                        simple:
                          expression: "cortacircuito abierto: no se llamó a ${variable.servicio}"
                  - log:
                      loggingLevel: WARN
                      message: "Cortacircuito de ${variable.canal} ABIERTO: no llamo a ${variable.servicio} por la orden ${variable.orden} momento ${variable.momento}; queda pendiente"
            otherwise:
              steps:
                - setVariable:
                    name: respuesta
                    expression:
                      simple:
                        expression: "${exchangeProperty.CamelExceptionCaught.class.simpleName}: ${exchangeProperty.CamelExceptionCaught.message} (cortacircuito ${exchangeProperty.CamelCircuitBreakerState})"
