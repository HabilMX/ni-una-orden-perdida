# El estado de la integración, en la base PostgreSQL «estado» (ver infra/postgres/01-estado.sql):
#
#   orden      una fila por orden: en qué momento va y lo que se sabe de ella (datos)
#   operacion  una fila por orden, momento y canal: qué hay que hacer y cómo quedó (estado)
#   intento    una fila por cada vez que se intentó una operación (ver reparto.camel.yaml)
#
# Guardar la orden y sus operaciones va en UNA transacción: o queda todo, o nada. Si la base no contesta,
# el router no contesta 202, y quien mandó sabe que tiene que volver a intentar.

- beans:
    - name: estado
      type: org.postgresql.ds.PGSimpleDataSource
      properties:
        url: "jdbc:postgresql://estado:5432/estado"
        user: router
        password: "{{env:ESTADO_CLAVE:practica}}"
    - name: transacciones
      type: org.springframework.jdbc.datasource.DataSourceTransactionManager
      properties:
        dataSource: "#estado"
    - name: todoONada
      type: org.apache.camel.spring.spi.SpringTransactionPolicy
      properties:
        transactionManager: "#transacciones"
        propagationBehaviorName: PROPAGATION_REQUIRED

# Qué canales le tocan a una orden. La regla «quién es socio», en un solo lugar (lección 11):
# las franquicias T-501 y T-502 reciben además el EDI.
- route:
    id: canales
    from:
      uri: direct:canales
      steps:
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${variable.tienda} in 'T-501,T-502'"
                steps:
                  - setVariable:
                      name: canales
                      expression:
                        constant:
                          expression: "rest,bd,edi"
            otherwise:
              steps:
                - setVariable:
                    name: canales
                    expression:
                      constant:
                        expression: "rest,bd"

# Lee de la base la tienda de una orden ya guardada. Si no existe, la variable tienda queda vacía.
# variableReceive: la respuesta de la base va a la variable, y el cuerpo (lo que llegó) no se toca.
- route:
    id: cargar-orden
    from:
      uri: direct:cargar-orden
      steps:
        - to:
            uri: "sql:SELECT datos->>'tienda' FROM orden WHERE orden = :#${variable.orden}"
            variableReceive: tienda
            parameters:
              dataSource: "#estado"
              outputType: SelectOne

# La orden nueva: la fila de la orden y una operación por canal, en «pendiente», TODO EN UNA TRANSACCIÓN.
# El cuerpo es la orden como la mandó la tienda: se guarda tal cual, como jsonb, en orden.datos.
- route:
    id: guardar-orden
    from:
      uri: direct:guardar-orden
      steps:
        - transacted:
            ref: todoONada
        - to:
            uri: "sql:INSERT INTO orden (orden, momento, datos) VALUES (:#${variable.orden}, 'creada', CAST(:#${body} AS jsonb))"
            parameters:
              dataSource: "#estado"
        # Una operación por canal. El canal del socio lleva su número de control, que da la secuencia de la base
        - split:
            expression:
              simple:
                expression: "${variable.canales.split(',')}"
            steps:
              - to:
                  uri: "sql:INSERT INTO operacion (orden, momento, canal, estado, numero_control, correlacion) VALUES (:#${variable.orden}, 'creada', :#${body}, 'pendiente', CASE WHEN :#${body} = 'edi' THEN CAST(nextval('numero_control_seq') AS text) END, :#${variable.correlacion})"
                  parameters:
                    dataSource: "#estado"

# Un momento nuevo de una orden que ya existe (el embarque o la entrega), en una transacción:
#   - la orden guarda lo que llegó, con el nombre de su momento, y avanza su momento (no retrocede:
#     si la entrega llegó antes que el embarque, la orden sigue en «entregada» cuando llega el embarque);
#   - se crea una operación por canal, y la MÁQUINA DE ESTADOS decide en qué estado nace: «pendiente» si ya puede
#     salir, o «estacionada» si le falta algo antes (por ejemplo, una entrega sin su embarque en ese canal).
#     Lo estacionado no se pierde ni se rechaza: espera a que el barrido lo suelte (barrido.camel.yaml).
- route:
    id: guardar-momento
    from:
      uri: direct:guardar-momento
      steps:
        - setVariable:
            name: clave
            expression:
              simple:
                expression: "${variable.momento == 'embarcada' ? 'embarque' : 'entrega'}"
        - transacted:
            ref: todoONada
        - to:
            uri: >-
              sql:UPDATE orden SET
              momento = CASE WHEN strpos('creada embarcada entregada', CAST(:#${variable.momento} AS text))
                                > strpos('creada embarcada entregada', momento)
                             THEN CAST(:#${variable.momento} AS text) ELSE momento END,
              datos = datos || jsonb_build_object(CAST(:#${variable.clave} AS text), CAST(:#${body} AS jsonb))
              WHERE orden = :#${variable.orden}
            parameters:
              dataSource: "#estado"
        - split:
            expression:
              simple:
                expression: "${variable.canales.split(',')}"
            steps:
              - setVariable:
                  name: canal
                  expression:
                    simple:
                      expression: "${body}"
              - to:
                  uri: direct:decidir
              - choice:
                  when:
                    - expression:
                        simple:
                          expression: "${variable.decision} == 'invalido'"
                      steps:
                        - log:
                            loggingLevel: WARN
                            message: "Orden ${variable.orden} momento ${variable.momento} canal ${variable.canal}: no es válido (${variable.motivo})"
                        - throwException:
                            exceptionType: java.lang.IllegalArgumentException
                            message: "${variable.motivo}"
                    - expression:
                        simple:
                          expression: "${variable.decision} == 'estaciona'"
                      steps:
                        - setVariable:
                            name: nace
                            expression:
                              constant:
                                expression: estacionada
                        - log:
                            message: "Orden ${variable.orden} momento ${variable.momento} canal ${variable.canal}: la estaciono (${variable.motivo})"
                  otherwise:
                    steps:
                      - setVariable:
                          name: nace
                          expression:
                            constant:
                              expression: pendiente
              - to:
                  uri: "sql:INSERT INTO operacion (orden, momento, canal, estado, numero_control, correlacion, huella) VALUES (:#${variable.orden}, :#${variable.momento}, :#${variable.canal}, :#${variable.nace}, CASE WHEN :#${variable.canal} = 'edi' THEN CAST(nextval('numero_control_seq') AS text) END, :#${variable.correlacion}, :#${variable.huella})"
                  parameters:
                    dataSource: "#estado"

# La máquina de estados decide, para UN canal, si el momento que llegó se procesa, se estaciona o no es válido.
# Junta lo que hace falta (la máquina, el momento, el canal y las operaciones ya guardadas de la orden) y se lo
# pasa al mapeo de decisión (mappings/estado/decision/v1), que calcula. Deja la respuesta en las variables
# decision y motivo, y el cuerpo como estaba.
- route:
    id: decidir
    from:
      uri: direct:decidir
      steps:
        - setVariable:
            name: guardado
            expression:
              simple:
                expression: "${body}"
        - to:
            uri: >-
              sql:SELECT COALESCE(CAST(json_agg(json_build_object('momento', momento, 'canal', canal, 'estado', estado)) AS text), '[]')
              FROM operacion WHERE orden = :#${variable.orden}
            variableReceive: operaciones
            parameters:
              dataSource: "#estado"
              outputType: SelectOne
        # La máquina (reglas/maquina-de-estados.yaml) se lee del archivo cada vez: un cambio en el YAML vale para lo siguiente que llegue
        #   (se lee con el componente language: un pollEnrich de file dejaría el archivo «en uso» mientras dura
        #   el mensaje, y la siguiente decisión del mismo mensaje no lo encontraría)
        - to:
            uri: language:constant:resource:file:reglas/maquina-de-estados.yaml
            parameters:
              contentCache: false
        - unmarshal:
            yaml: {}
        - marshal:
            json: {}
        - setBody:
            expression:
              simple:
                expression: '{"maquina":${bodyAs(String)},"momento":"${variable.momento}","canal":"${variable.canal}","operaciones":${variable.operaciones}}'
        - to:
            uri: jsonata:mappings/estado/decision/v1/mapeo.jsonata
            parameters:
              inputType: JsonString
              outputType: JsonString
        - unmarshal:
            json: {}
        - setVariable:
            name: decision
            expression:
              simple:
                expression: "${body[decision]}"
        - setVariable:
            name: motivo
            expression:
              simple:
                expression: "${body[motivo]}"
        - setBody:
            expression:
              simple:
                expression: "${variable.guardado}"
