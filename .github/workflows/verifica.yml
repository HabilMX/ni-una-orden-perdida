# Corre el `verifica` de cada lección con la solución de referencia, en cada cambio.
# Así cualquiera que visite el repo ve, en el README, que la práctica funciona hoy.
#
# Qué hace, en orden:
#   1. Levanta el ambiente de la 00 (infra/compose.yaml) y corre su verifica.
#   2. Recorre las lecciones en orden y corre `./verifica solucion` en cada una. Salta las del apéndice
#      (las que traen un archivo .apendice): piden kind y una compilación nativa, y las corre apendice.yml a mano.
#   3. Control positivo: la primera lección en la que el alumno escribe algo debe salir en ROJO con `inicio/`.
#      Si saliera verde, el verifica no está midiendo nada y la corrida falla. La 01 y la 02 no sirven de
#      control: se entregan resueltas a propósito (la 01 es idéntica a su solución; en la 02 el alumno lee,
#      predice y corre), así que salen verdes con `inicio/`. Hoy el control cae en la 03.
#   4. Cuenta los ✅ y ❌ de la salida. El total se lee de ahí, no del código de salida.
#
# No usa ningún secreto: el token de la corrida es de solo lectura.
name: verifica

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifica-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lecciones:
    runs-on: ubuntu-24.04
    # En una Mac M5, con las imágenes y las dependencias ya bajadas, la suite tardó 21 min (1 264 s). Aquí empieza en
    # frío (bajar imágenes y dependencias de Maven) y en 4 núcleos x86 más lentos: se estima entre 2 y 3 veces más.
    # 90 min deja margen sin dejar colgada una corrida trabada toda la tarde.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Ambiente de la práctica (lección 00)
        run: |
          docker volume create practica-retail-m2
          docker compose -f infra/compose.yaml up -d --wait
          lecciones/00-ambiente/verifica 2>&1 | tee -a salida.txt

      - name: Lecciones con la solución de referencia
        run: |
          fallo=0
          for d in lecciones/[0-9][0-9]-*/; do
            n=$(basename "$d")
            [ "$n" = "00-ambiente" ] && continue
            [ -f "$d/.apendice" ] && { echo "⏭  $n: es del apéndice, la corre el workflow apendice"; continue; }
            [ -x "$d/verifica" ] && [ -d "$d/solucion" ] || { echo "⏭  $n: sin verifica o sin solucion, se salta"; continue; }
            echo "::group::$n"
            ( cd "$d" && ./verifica solucion ) 2>&1 | tee -a salida.txt
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ "$rc" -eq 0 ] || { echo "::error::$n salió con $rc"; fallo=1; }
          done
          exit $fallo

      - name: Control positivo (inicio debe salir en rojo)
        run: |
          # Lo que crea la corrida (entrada/, salida/, .camel-jbang/) no cuenta como diferencia.
          distinto() { ! diff -rq -x entrada -x salida -x .camel-jbang -x mio "$1/inicio" "$1/solucion" >/dev/null; }
          # La 01 y la 02 se entregan resueltas: el alumno no escribe nada, así que no miden trabajo suyo.
          resuelta() { case "$1" in lecciones/01-*|lecciones/02-*) return 0 ;; *) return 1 ;; esac; }
          d=$(ls -d lecciones/[0-9][0-9]-*/ | while read l; do
                resuelta "$l" && continue
                [ -d "$l/inicio" ] && [ -d "$l/solucion" ] && [ -x "$l/verifica" ] && distinto "$l" && { echo "$l"; break; }
              done)
          [ -n "$d" ] || { echo "::error::No hay ninguna lección con inicio/ distinto de solucion/ para el control"; exit 1; }
          if ( cd "$d" && ./verifica inicio ) > control.txt 2>&1; then
            cat control.txt; echo "::error::$d salió VERDE con inicio/: el verifica no está midiendo"; exit 1
          fi
          echo "✔ $d salió en rojo con inicio/, como debe"

      - name: Conteo
        if: always()
        run: |
          v=$(grep -c '✅' salida.txt || true); r=$(grep -c '❌' salida.txt || true)
          echo "### verifica: ${v} ✅ · ${r} ❌" >> "$GITHUB_STEP_SUMMARY"
          echo "verdes=$v rojos=$r"
          [ "$v" -gt 0 ] || { echo "::error::Cero checks contados: la corrida no midió nada"; exit 1; }
          [ "$r" -eq 0 ]

      - name: Bitácoras si algo falló
        if: failure()
        run: docker compose -f infra/compose.yaml logs --tail 80
